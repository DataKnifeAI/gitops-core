# Compat ConfigMap formerly used by nginx-ingress.
# Traefik default cert is HelmChartConfig rke2-traefik tlsStore
# (secret kube-system/wildcard-dataknife-net-tls).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: kube-system
  labels:
    app: cert-manager
    managed-by: gitops
data:
  default-ssl-certificate: "kube-system/wildcard-dataknife-net-tls"

# ConfigMap to configure nginx-ingress default SSL certificate
#
# NOTE: ConfigMap alone is insufficient on RKE2 — use
# helmchartconfig-rke2-ingress-nginx.yaml for durable
# controller.extraArgs.default-ssl-certificate across Helm reapply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: kube-system
  labels:
    app: cert-manager
    managed-by: gitops
data:
  # Default SSL certificate for nginx-ingress
  # Format: namespace/secret-name
  default-ssl-certificate: "kube-system/wildcard-dataknife-net-tls"
